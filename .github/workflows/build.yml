name: Validate and build
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm test && npm run check
  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read and validate image metadata
        id: metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          config = Path('chii_debugger/config.yaml').read_text()
          version = re.search(r'^version: "([0-9A-Za-z.-]+)"$', config, re.M).group(1)
          image = re.search(r'^image: "([a-z0-9./-]+)"$', config, re.M).group(1)
          assert image == 'ghcr.io/' + os.environ['REPOSITORY'].lower(), 'Image must match repository'
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['REF_NAME'] == 'v' + version, 'Tag must match config.yaml version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'image={image}\nversion={version}\n')
          PY
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.request, urllib.error
          owner, package = os.environ['REPOSITORY'].lower().split('/')
          for page in range(1, 1001):
              url = f'https://api.github.com/users/{owner}/packages/container/{package}/versions?per_page=100&page={page}'
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urllib.request.urlopen(request) as response:
                      versions = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and page == 1:
                      break  # The package does not exist before its first publication.
                  raise SystemExit(f'Package lookup failed (HTTP {error.code})')
              for version in versions:
                  if os.environ['VERSION'] in version['metadata']['container']['tags']:
                      raise SystemExit('This image tag already exists. Bump the app version.')
              if len(versions) < 100:
                  break
          else:
              raise SystemExit('Package pagination limit reached; refusing publication')
          PYTHON
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./chii_debugger
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
